services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: covid
      POSTGRES_PASSWORD: covid
      POSTGRES_DB: covid
    ports:
      - "5432:5432"
    volumes:
      - covid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U covid -d covid"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  covid_pgdata:
